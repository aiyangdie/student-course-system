server:
  port: 8088
  servlet:
    context-path: /api

spring:
  application:
    name: student-course-system
  profiles:
    # 本地开发可新建 application-local.yml（已 gitignore）并使用 --spring.profiles.active=local
    active: ${SPRING_PROFILES_ACTIVE:default}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 请复制 application-example.yml 或直接修改下面账号密码为你的本地 MySQL
    url: jdbc:mysql://localhost:3306/course_selection?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_general_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: your_mysql_password
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    com.course: info
